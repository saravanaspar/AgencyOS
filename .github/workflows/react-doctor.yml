name: Verify

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run full verification
        run: npm run verify

  authenticated-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17.10-bookworm@sha256:4f736ae292687621d4dbe0d499ffd024a36bd2ee7d8ca6f2ccd4c800f047b394
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: agencyos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d agencyos"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7.4.10-alpine@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/agencyos
      DATABASE_ADMIN_URL: postgres://postgres:postgres@127.0.0.1:5432/agencyos
      REDIS_URL: redis://127.0.0.1:6379/0
      APP_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
      AUTH_ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      CRM_CONNECTOR_ENCRYPTION_KEY: ZmVkY2JhOTg3NjU0MzIxMGZlZGNiYTk4NzY1NDMyMTA=
      INTERNAL_WORKER_SECRET: ci-only-internal-worker-secret-32-bytes-minimum
      AGENCYOS_E2E_CONFIRM_ISOLATED: "1"
      AGENCYOS_E2E_OWNER_EMAIL: owner@e2e.agencyos.test
      AGENCYOS_E2E_OWNER_PASSWORD: AgencyOS-E2E-Only-Password-2026
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install pgTAP in disposable PostgreSQL service
        run: |
          docker exec "${{ job.services.postgres.id }}" bash -lc 'apt-get update && apt-get install -y --no-install-recommends postgresql-17-pgtap && rm -rf /var/lib/apt/lists/*'
      - name: Install dependencies and Chromium
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Migrate and test disposable database
        run: |
          npm run db:migrate
          npm run db:test
      - name: Seed disposable authenticated account
        run: npm run test:e2e:seed
      - name: Run authenticated browser audit
        run: npm run test:e2e
