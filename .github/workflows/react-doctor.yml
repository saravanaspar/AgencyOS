name: Verify

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run full verification
        run: npm run verify

  authenticated-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/agencyos
      DATABASE_ADMIN_URL: postgres://postgres:postgres@127.0.0.1:5432/agencyos
      AGENCYOS_POSTGRES_USER: postgres
      AGENCYOS_POSTGRES_PASSWORD: postgres
      AGENCYOS_POSTGRES_DB: agencyos
      REDIS_URL: redis://127.0.0.1:6379/0
      APP_URL: http://127.0.0.1:3000
      AUTH_ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      CRM_CONNECTOR_ENCRYPTION_KEY: ZmVkY2JhOTg3NjU0MzIxMGZlZGNiYTk4NzY1NDMyMTA=
      INTERNAL_WORKER_SECRET: ci-only-internal-worker-secret-32-bytes-minimum
      AGENCYOS_E2E_CONFIRM_ISOLATED: "1"
      AGENCYOS_E2E_OWNER_EMAIL: owner@e2e.agencyos.test
      AGENCYOS_E2E_OWNER_PASSWORD: AgencyOS-E2E-Only-Password-2026
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install rootless Podman Compose
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends podman podman-compose
      - name: Start disposable PostgreSQL and Redis with Podman
        run: |
          podman-compose --project-name agencyos-ci \
            -f compose.database.yaml -f compose.redis.yaml up -d --build
          for attempt in $(seq 1 30); do
            if podman exec agencyos-postgres pg_isready -U postgres -d agencyos >/dev/null \
              && podman exec agencyos-redis redis-cli ping | grep -q PONG; then
              exit 0
            fi
            sleep 2
          done
          podman ps --all
          podman logs agencyos-postgres
          podman logs agencyos-redis
          exit 1
      - name: Install dependencies and Chromium
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Migrate and test disposable database
        run: |
          npm run db:migrate
          npm run db:test
      - name: Seed disposable authenticated account
        run: npm run test:e2e:seed
      - name: Run authenticated browser audit
        run: npm run test:e2e
      - name: Stop disposable Podman dependencies
        if: always()
        run: |
          podman-compose --project-name agencyos-ci \
            -f compose.database.yaml -f compose.redis.yaml down -v
