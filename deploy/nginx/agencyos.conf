# This gateway is the trusted header boundary for the application container.
# If another load balancer/CDN is placed in front, configure its trusted client-IP
# restoration at that edge; do not pass arbitrary browser-supplied X-Forwarded-For.
map $http_x_forwarded_proto $agencyos_forwarded_proto {
  default $scheme;
  "http" http;
  "https" https;
}

map $http_upgrade $connection_upgrade {
  default upgrade;
  "" close;
}

server {
  listen 8080;
  server_name _;

  client_max_body_size 28m;
  client_body_timeout 30s;
  proxy_request_buffering on;

  location / {
    proxy_pass http://app:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $agencyos_forwarded_proto;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Request-ID $request_id;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_connect_timeout 5s;
    proxy_read_timeout 75s;
    proxy_send_timeout 75s;
  }
}
