services:
  clamav:
    image: docker.io/clamav/clamav:1.5.3-debian13-slim@sha256:741e6c447241220e0792a901befcaec1d55a755c5097fc9cd88d7fd8be251a5c
    container_name: agencyos-clamav
    restart: unless-stopped
    ports:
      - "127.0.0.1:3310:3310"
    volumes:
      - agencyos-clamav-signatures:/var/lib/clamav
    stop_grace_period: 30s

volumes:
  agencyos-clamav-signatures:
    name: ${AGENCYOS_CLAMAV_VOLUME:-agencyos_clamav_signatures}
