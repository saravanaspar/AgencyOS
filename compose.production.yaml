x-agencyos-service: &agencyos-service
  image: ${AGENCYOS_IMAGE:?Set AGENCYOS_IMAGE to an immutable application digest (name@sha256:...)}
  env_file:
    - ${AGENCYOS_ENV_FILE:-.env.production}
  restart: unless-stopped
  read_only: true
  tmpfs:
    - /tmp:size=1073741824,mode=1777
  security_opt:
    - no-new-privileges:true
  stop_grace_period: 30s
  pids_limit: ${AGENCYOS_PIDS_LIMIT:-256}
  mem_limit: ${AGENCYOS_MEMORY_LIMIT:-2g}
  cpus: ${AGENCYOS_CPU_LIMIT:-2.0}

services:
  app:
    <<: *agencyos-service
    command: ["node", "server.js"]
    expose:
      - "3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  worker:
    <<: *agencyos-service
    command: ["node", "scripts/workers/run.mjs"]
    environment:
      INTERNAL_APP_URL: http://app:3000
      WORKER_MAX_CONCURRENCY: ${WORKER_MAX_CONCURRENCY:-3}
    depends_on:
      app:
        condition: service_healthy

  gateway:
    image: docker.io/library/nginx:1.29.8-alpine3.23@sha256:5616878291a2eed594aee8db4dade5878cf7edcb475e59193904b198d9b830de
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=67108864,mode=0755
      - /var/run:size=1048576,mode=0755
      - /tmp:size=16777216,mode=1777
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 256m
    cpus: 1.0
    volumes:
      - ./deploy/nginx/agencyos.conf:/etc/nginx/conf.d/default.conf:ro,Z
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/api/health/live"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
