# Coolify hosted-data-plane stack. Select this file only after creating the hosted resources.
# PostgreSQL (Neon-compatible), Redis (Upstash-compatible), and runtime object storage are external.
# Route the AgencyOS domain to gateway:8080 and the vault domain to vaultwarden:8080.

x-object-storage-environment: &object-storage-environment
  OBJECT_STORAGE_ENDPOINT: ${OBJECT_STORAGE_ENDPOINT:?Set the S3-compatible runtime endpoint}
  OBJECT_STORAGE_REGION: ${OBJECT_STORAGE_REGION:?Set the runtime object-storage region}
  OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:?Set the mutable runtime bucket}

x-app-environment: &app-environment
  <<: *object-storage-environment
  NODE_ENV: production
  APP_URL: ${APP_URL:?Set the public AgencyOS HTTPS URL}
  DATABASE_URL: ${DATABASE_URL:?Set the pooled TLS AgencyOS PostgreSQL URL}
  DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-8}
  REDIS_URL: ${REDIS_URL:?Set the authenticated native rediss URL}
  OBJECT_STORAGE_ACCESS_KEY_ID: ${OBJECT_STORAGE_ACCESS_KEY_ID:?Set the runtime object-storage key ID}
  OBJECT_STORAGE_SECRET_ACCESS_KEY: ${OBJECT_STORAGE_SECRET_ACCESS_KEY:?Set the runtime object-storage secret}
  PRIVATE_FILE_SCANNER_URL: clamav://clamav:3310
  REDIS_REQUIRED: "1"
  OBJECT_STORAGE_REQUIRED: "1"
  PRIVATE_FILE_SCANNER_REQUIRED: "1"
  AGENCYOS_TRUST_PRIVATE_SERVICE_NETWORK: "1"
  INTERNAL_WORKER_SECRET: ${INTERNAL_WORKER_SECRET:?Set a 32+ character worker secret}
  AUTH_ENCRYPTION_KEY: ${AUTH_ENCRYPTION_KEY:?Set a stable 32-byte encryption key}
  CRM_CONNECTOR_ENCRYPTION_KEY: ${CRM_CONNECTOR_ENCRYPTION_KEY:?Set a stable 32-byte encryption key}
  AUDIT_PIPELINE_ALERT_WEBHOOK_URL: ${AUDIT_PIPELINE_ALERT_WEBHOOK_URL:?Set the HTTPS audit alert webhook}
  AUDIT_PIPELINE_ALERT_WEBHOOK_SECRET: ${AUDIT_PIPELINE_ALERT_WEBHOOK_SECRET:?Set its 32+ character secret}
  RESEND_API_KEY: ${RESEND_API_KEY:-}
  NOTIFICATION_EMAIL_FROM: ${NOTIFICATION_EMAIL_FROM:-}
  NOTIFICATION_DELIVERY_ENCRYPTION_KEY: ${NOTIFICATION_DELIVERY_ENCRYPTION_KEY:-}
  REPORT_DELIVERY_ENCRYPTION_KEY: ${REPORT_DELIVERY_ENCRYPTION_KEY:-}
  SECURITY_RATE_LIMIT_REDIS_FAILURE_MODE: deny
  SECURITY_WORKER_RATE_LIMIT_PER_MINUTE: ${SECURITY_WORKER_RATE_LIMIT_PER_MINUTE:-120}

x-app-service: &app-service
  image: ${AGENCYOS_IMAGE:?Set an immutable application digest (name@sha256:...)}
  environment: *app-environment
  restart: unless-stopped
  read_only: true
  init: true
  tmpfs:
    - /tmp:size=536870912,mode=1777
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  stop_grace_period: 30s
  pids_limit: 256

x-backup-environment: &backup-environment
  <<: *object-storage-environment
  NODE_ENV: production
  AGENCYOS_OPERATIONS_IMAGE: ${AGENCYOS_OPERATIONS_IMAGE:?Set the immutable operations digest}
  AGENCYOS_RELEASE_ID: ${AGENCYOS_RELEASE_ID:-manual-first-deploy}
  DATABASE_ADMIN_URL: ${DATABASE_ADMIN_URL:?Set the direct TLS AgencyOS PostgreSQL URL}
  VAULTWARDEN_DATABASE_ADMIN_URL: ${VAULTWARDEN_DATABASE_ADMIN_URL:?Set the direct TLS Vaultwarden PostgreSQL URL}
  OBJECT_STORAGE_ACCESS_KEY_ID: ${OBJECT_STORAGE_ACCESS_KEY_ID:?Set the runtime key ID for separation validation}
  OBJECT_STORAGE_BACKUP_ACCESS_KEY_ID: ${OBJECT_STORAGE_BACKUP_ACCESS_KEY_ID:?Set the runtime-bucket read key ID}
  OBJECT_STORAGE_BACKUP_SECRET_ACCESS_KEY: ${OBJECT_STORAGE_BACKUP_SECRET_ACCESS_KEY:?Set the runtime-bucket read key}
  B2_ENDPOINT: ${B2_ENDPOINT:?Set the immutable backup B2 S3 HTTPS endpoint}
  B2_BUCKET: ${B2_BUCKET:?Set the separate Object-Lock-enabled backup bucket}
  B2_PREFIX: ${B2_PREFIX:-agencyos/restic}
  B2_REGION: ${B2_REGION:-us-west-004}
  B2_WRITER_KEY_ID: ${B2_WRITER_KEY_ID:?Set the non-delete backup writer key ID}
  B2_WRITER_APPLICATION_KEY: ${B2_WRITER_APPLICATION_KEY:?Set the backup writer application key}
  RESTIC_PASSWORD: ${RESTIC_PASSWORD:?Set and separately escrow the Restic password}
  BACKUP_HOST: ${BACKUP_HOST:-agencyos-production}
  BACKUP_HOUR_UTC: ${BACKUP_HOUR_UTC:-2}
  BACKUP_MAINTENANCE_HOUR_UTC: ${BACKUP_MAINTENANCE_HOUR_UTC:-5}
  BACKUP_JITTER_MINUTES: ${BACKUP_JITTER_MINUTES:-20}
  BACKUP_MAX_AGE_HOURS: ${BACKUP_MAX_AGE_HOURS:-30}
  BACKUP_COMMAND_TIMEOUT_MS: ${BACKUP_COMMAND_TIMEOUT_MS:-3600000}
  BACKUP_SUCCESS_HEARTBEAT_URL: ${BACKUP_SUCCESS_HEARTBEAT_URL:?Set an external dead-man heartbeat URL}
  BACKUP_FAILURE_WEBHOOK_URL: ${BACKUP_FAILURE_WEBHOOK_URL:-}
  BACKUP_FAILURE_WEBHOOK_SECRET: ${BACKUP_FAILURE_WEBHOOK_SECRET:-}

x-operations-service: &operations-service
  image: ${AGENCYOS_OPERATIONS_IMAGE:?Set an immutable operations digest (name@sha256:...)}
  read_only: true
  tmpfs:
    - /tmp:size=134217728,mode=1777
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  pids_limit: 192
  mem_limit: 768m
  cpus: 0.75

services:
  clamav:
    image: docker.io/clamav/clamav:1.5.3-debian13-slim@sha256:741e6c447241220e0792a901befcaec1d55a755c5097fc9cd88d7fd8be251a5c
    restart: unless-stopped
    volumes:
      - clamav-signatures:/var/lib/clamav
    networks:
      - private
      - egress
    healthcheck:
      test: ["CMD-SHELL", "clamdscan --ping 1 --wait >/dev/null 2>&1"]
      interval: 30s
      timeout: 10s
      retries: 30
      start_period: 180s
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 3g
    cpus: 1.0
    stop_grace_period: 45s

  dependency-preflight:
    <<: *operations-service
    command: ["node", "scripts/operations/validate-production-dependencies.mjs"]
    restart: "no"
    environment:
      <<: *object-storage-environment
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?Set the pooled TLS AgencyOS PostgreSQL URL}
      DATABASE_ADMIN_URL: ${DATABASE_ADMIN_URL:?Set the direct TLS AgencyOS PostgreSQL URL}
      VAULTWARDEN_DATABASE_URL: ${VAULTWARDEN_DATABASE_URL:?Set the Vaultwarden PostgreSQL URL}
      VAULTWARDEN_DATABASE_ADMIN_URL: ${VAULTWARDEN_DATABASE_ADMIN_URL:?Set its direct dump URL}
      REDIS_URL: ${REDIS_URL:?Set the authenticated native rediss URL}
      OBJECT_STORAGE_ACCESS_KEY_ID: ${OBJECT_STORAGE_ACCESS_KEY_ID:?Set the runtime object-storage key ID}
      OBJECT_STORAGE_SECRET_ACCESS_KEY: ${OBJECT_STORAGE_SECRET_ACCESS_KEY:?Set the runtime object-storage secret}
      OBJECT_STORAGE_BACKUP_ACCESS_KEY_ID: ${OBJECT_STORAGE_BACKUP_ACCESS_KEY_ID:?Set the source-read key ID}
      B2_ENDPOINT: ${B2_ENDPOINT:?Set the immutable backup endpoint}
      B2_BUCKET: ${B2_BUCKET:?Set the separate immutable backup bucket}
      B2_WRITER_KEY_ID: ${B2_WRITER_KEY_ID:?Set the immutable backup writer key ID}
      PRIVATE_FILE_SCANNER_URL: clamav://clamav:3310
      AGENCYOS_TRUST_PRIVATE_SERVICE_NETWORK: "1"
    depends_on:
      clamav:
        condition: service_healthy
    networks:
      - private
      - egress

  vaultwarden:
    image: docker.io/vaultwarden/server:1.37.2@sha256:094b5689ed81549bd293418395c7cf495ae9d960fc2d4928cef2083ef913d912
    restart: unless-stopped
    environment:
      DATABASE_URL: ${VAULTWARDEN_DATABASE_URL:?Set the hosted Vaultwarden PostgreSQL URL}
      DOMAIN: ${VAULTWARDEN_URL:?Set the public Vaultwarden HTTPS URL}
      SIGNUPS_ALLOWED: ${VAULTWARDEN_SIGNUPS_ALLOWED:-false}
      INVITATIONS_ALLOWED: ${VAULTWARDEN_INVITATIONS_ALLOWED:-false}
      ADMIN_TOKEN: ${VAULTWARDEN_ADMIN_TOKEN:-}
      ROCKET_PORT: "8080"
      WEBSOCKET_ENABLED: "true"
    volumes:
      - vaultwarden-data:/data
    expose:
      - "8080"
    depends_on:
      dependency-preflight:
        condition: service_completed_successfully
    networks:
      - private
      - egress
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/alive"]
      interval: 30s
      timeout: 5s
      retries: 15
      start_period: 60s
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 256m
    cpus: 0.25
    stop_grace_period: 30s

  predeploy-backup:
    <<: *operations-service
    command: ["node", "scripts/backup/run-backup.mjs", "--reason=predeploy"]
    restart: "no"
    environment: *backup-environment
    volumes:
      - backup-state:/state
      - restic-cache:/cache
      - restic-repository:/repository
      - backup-stage:/stage
      - vaultwarden-data:/vaultwarden-data:ro
    depends_on:
      dependency-preflight:
        condition: service_completed_successfully
      vaultwarden:
        condition: service_healthy
    networks:
      - egress

  migrate:
    <<: *operations-service
    command: ["node", "scripts/operations/release-gate.mjs"]
    restart: "no"
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?Set the pooled TLS AgencyOS PostgreSQL URL}
      DATABASE_ADMIN_URL: ${DATABASE_ADMIN_URL:?Set the direct TLS AgencyOS PostgreSQL URL}
      AGENCYOS_RELEASE_ID: ${AGENCYOS_RELEASE_ID:-manual-first-deploy}
      AGENCYOS_OPERATIONS_IMAGE: ${AGENCYOS_OPERATIONS_IMAGE:?Set the immutable operations digest}
      AGENCYOS_RELEASE_STATUS_DIR: /release-status
    volumes:
      - release-status:/release-status
    depends_on:
      predeploy-backup:
        condition: service_completed_successfully
    networks:
      - egress

  app:
    <<: *app-service
    command: ["node", "server.js"]
    expose:
      - "3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      clamav:
        condition: service_healthy
    networks:
      - private
      - egress
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 8
      start_period: 45s
    mem_limit: 1536m
    cpus: 1.25

  worker:
    <<: *app-service
    command: ["node", "scripts/workers/run.mjs"]
    environment:
      <<: *app-environment
      INTERNAL_APP_URL: http://app:3000
      WORKER_MAX_CONCURRENCY: ${WORKER_MAX_CONCURRENCY:-2}
    depends_on:
      app:
        condition: service_healthy
    networks:
      - private
      - egress
    mem_limit: 512m
    cpus: 0.5

  gateway:
    image: docker.io/library/nginx:1.29.8-alpine3.23@sha256:5616878291a2eed594aee8db4dade5878cf7edcb475e59193904b198d9b830de
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=67108864,mode=0755
      - /var/run:size=1048576,mode=0755
      - /tmp:size=16777216,mode=1777
    volumes:
      - ./deploy/nginx/agencyos.conf:/etc/nginx/conf.d/default.conf:ro
    expose:
      - "8080"
    depends_on:
      app:
        condition: service_healthy
    networks:
      - private
      - egress
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/api/health/live"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
    pids_limit: 96
    mem_limit: 128m
    cpus: 0.2

  backup:
    <<: *operations-service
    command: ["node", "scripts/backup/scheduler.mjs"]
    restart: unless-stopped
    environment: *backup-environment
    volumes:
      - backup-state:/state
      - restic-cache:/cache
      - restic-repository:/repository
      - backup-stage:/stage
      - vaultwarden-data:/vaultwarden-data:ro
    depends_on:
      predeploy-backup:
        condition: service_completed_successfully
    networks:
      - egress
    healthcheck:
      test: ["CMD", "node", "scripts/backup/health.mjs"]
      interval: 10m
      timeout: 10s
      retries: 3
      start_period: 10m

  backup-maintenance:
    <<: *operations-service
    command: ["node", "scripts/backup/scheduler.mjs", "--maintenance"]
    restart: unless-stopped
    environment:
      NODE_ENV: production
      B2_ENDPOINT: ${B2_ENDPOINT:?Set the immutable backup endpoint}
      B2_BUCKET: ${B2_BUCKET:?Set the immutable backup bucket}
      B2_PREFIX: ${B2_PREFIX:-agencyos/restic}
      B2_REGION: ${B2_REGION:-us-west-004}
      B2_MAINTENANCE_KEY_ID: ${B2_MAINTENANCE_KEY_ID:?Set the read-only maintenance key ID}
      B2_MAINTENANCE_APPLICATION_KEY: ${B2_MAINTENANCE_APPLICATION_KEY:?Set its application key}
      RESTIC_PASSWORD: ${RESTIC_PASSWORD:?Set and escrow the Restic password}
      BACKUP_KEEP_DAILY: ${BACKUP_KEEP_DAILY:-7}
      BACKUP_KEEP_WEEKLY: ${BACKUP_KEEP_WEEKLY:-4}
      BACKUP_KEEP_MONTHLY: ${BACKUP_KEEP_MONTHLY:-12}
      BACKUP_KEEP_YEARLY: ${BACKUP_KEEP_YEARLY:-1}
      BACKUP_PRUNE_ENABLED: ${BACKUP_PRUNE_ENABLED:-0}
      BACKUP_COMMAND_TIMEOUT_MS: ${BACKUP_COMMAND_TIMEOUT_MS:-3600000}
      BACKUP_MAINTENANCE_HOUR_UTC: ${BACKUP_MAINTENANCE_HOUR_UTC:-5}
      BACKUP_JITTER_MINUTES: ${BACKUP_JITTER_MINUTES:-20}
      BACKUP_MAX_AGE_HOURS: ${BACKUP_MAX_AGE_HOURS:-30}
    volumes:
      - backup-state:/state
      - restic-cache:/cache
      - restic-repository:/repository
    depends_on:
      predeploy-backup:
        condition: service_completed_successfully
    networks:
      - egress
    healthcheck:
      test: ["CMD", "node", "scripts/backup/health.mjs", "--maintenance"]
      interval: 30m
      timeout: 10s
      retries: 3
      start_period: 10m

networks:
  private:
    internal: true
  egress:
    driver: bridge

volumes:
  clamav-signatures:
    name: ${AGENCYOS_VOLUME_PREFIX:-agencyos-production}-clamav-signatures-v1
  vaultwarden-data:
    name: ${AGENCYOS_VOLUME_PREFIX:-agencyos-production}-vaultwarden-v1
  backup-state:
    name: ${AGENCYOS_VOLUME_PREFIX:-agencyos-production}-backup-state-v1
  restic-cache:
    name: ${AGENCYOS_VOLUME_PREFIX:-agencyos-production}-restic-cache-v1
  restic-repository:
    name: ${AGENCYOS_VOLUME_PREFIX:-agencyos-production}-restic-repository-v1
  backup-stage:
    name: ${AGENCYOS_VOLUME_PREFIX:-agencyos-production}-backup-stage-v1
  release-status:
    name: ${AGENCYOS_VOLUME_PREFIX:-agencyos-production}-release-status-v1
