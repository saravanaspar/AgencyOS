services:
  redis:
    image: docker.io/library/redis:7.4.11-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
    container_name: agencyos-redis
    command:
      ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--save", "60", "1000"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:${AGENCYOS_REDIS_PORT:-6379}:6379"
    volumes:
      - agencyos_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    stop_grace_period: 30s

volumes:
  agencyos_redis_data:
    name: ${AGENCYOS_REDIS_VOLUME:-agencyos_redis_data}
